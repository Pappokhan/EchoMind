{% extends "base.html" %}
{% block title %}EchoMind — Log in{% endblock %}
{% block content %}

<section class="auth-wrap">
  <div class="card auth-card">
    <p class="eyebrow">Welcome back</p>
    <h1 class="auth-title">Log in to EchoMind</h1>
    <p class="auth-sub">Your entries are private to your account.</p>

    <form method="post" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field-label" for="username">Username or email</label>
      <input type="text" id="username" name="username" autocomplete="username"
             value="{{ form.username or '' }}" required autofocus>

      <label class="field-label" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <label class="checkbox-row">
        <input type="checkbox" name="remember" value="1">
        <span>Keep me signed in</span>
      </label>

      <button type="submit" class="btn-primary auth-submit">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>

{% endblock %}
